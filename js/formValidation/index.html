<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      form {
        display: flex;
        flex-direction: column;
        width: 300px;
      }

      label {
        margin-top: 10px;
      }

      input {
        margin-bottom: 5px;
      }

      span {
        color: red;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <form action="" onsubmit="return validateForm();">
      <label for="name">Name</label>
      <input type="text" name="name" id="name" oninput="clearWarnings()" /><span
        id="dataWarningName"
      ></span>

      <label for="email">Email</label>
      <input
        type="email"
        name="email"
        id="email"
        oninput="clearWarnings()"
      /><span id="dataWarningEmail"></span>

      <label for="password">Password</label>
      <input
        type="password"
        name="password"
        id="password"
        oninput="clearWarnings()"
      /><span id="dataWarningPassword"></span>

      <button type="submit">Submit</button>
    </form>

    <script>
      function clearWarnings() {
        document.getElementById("dataWarningName").textContent = "";
        document.getElementById("dataWarningEmail").textContent = "";
        document.getElementById("dataWarningPassword").textContent = "";
      }

      function validateForm() {
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const spanName = document.getElementById("dataWarningName");
        const spanEmail = document.getElementById("dataWarningEmail");
        const spanPassword = document.getElementById("dataWarningPassword");
        let isValid = true;
        if (name.trim() === "") {
          spanName.textContent = "Name is required";

          isValid = false;
        }
        //
        if (email.trim() === "") {
          spanEmail.textContent = "Email is required";
          isValid = false;
        }

        if (password.length < 8) {
          spanPassword.textContent =
            "Password must be at least 8 characters long";
          isValid = false;
        }
        //
        return isValid;
      }
    </script>
  </body>
</html>
